<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>heinhtet</title>
<link rel="stylesheet" href="dev.css">
<style>
  #label { position: fixed; left: 0; right: 0; top: 10px; text-align: center; font: 700 16px/1.5 "Noto Sans Myanmar", sans-serif; color: #2A2118; }
  #label small { display: block; font: 12px/1.3 monospace; color: #8C6A28; }
  #ui { position: fixed; left: 0; right: 0; bottom: 30px; display: none; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 0 8px; }
  #ui button { font: 11px/1 monospace; padding: 6px 6px; border-radius: 8px; border: 1px solid #A47A2C; background: #F6F0E2; color: #2A2118; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label"></div>
<div id="ui"></div>
<div id="stats"></div>
<script type="module">
// Dev page for js/story/heinhtet/look.js (Ko Hein Htet)
// ?anim=<name>|run|idle  ?speed=<m/s> (run speed; default 4 for anim=run)  ?t=<seconds> (freeze at that time)
// ?view=front|side|three|back|game|car  ?zoom=<k> (game/car view, k times nearer)  ?maya=1 (Maya beside him for scale)  ?time=evening|night|noon  ?ui=1 (buttons)
// window.show({ anim, t, view, speed, maya, time }) re-poses for batched shots; window.__hhStats = his own calls/triangles
window.addEventListener('error', (e) => { document.title = `ERR ${e.message} @${e.lineno}`; window.__err = document.title; });
window.addEventListener('unhandledrejection', (e) => { document.title = `ERR ${e.reason?.message || e.reason}`; window.__err = document.title; });

import * as THREE from '../js/game/three.js';
import { PALETTE, toon, addStandardLights, fontsReady, setOutlineResolution } from '../js/game/toon.js';
import { VoxelBuilder } from '../js/game/voxel.js';
import { sampleDaytime } from '../js/game/daytime.js';
import { createHeinHtet, HH_ANIMS, HH_ANIM_DUR } from '../js/story/heinhtet/look.js';

const params = new URLSearchParams(location.search);
await fontsReady();
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 400);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#F2E6CC');
const lights = addStandardLights(scene);

// neutral ground: parchment with a faint metre grid, and a strip of road for the game views
const ground = new THREE.Group();
{
  const v = new VoxelBuilder();
  v.boxMin(-14, -0.1, -10, 14, 0, 10, PALETTE.paper);
  for (let i = -13; i <= 13; i++) v.boxMin(i - 0.006, 0, -10, i + 0.006, 0.002, 10, '#D8CDB6');
  for (let i = -9; i <= 9; i++) v.boxMin(-14, 0, i - 0.006, 14, 0.002, i + 0.006, '#D8CDB6');
  v.boxMin(-14, 0, -1.2, 14, 0.004, 1.2, '#CDBB98');
  ground.add(v.mesh({ outline: false }));
}
scene.add(ground);

let hh = null, maya = null, mayaMod = null;
const cfg = { anim: null, t: null, view: 'front', speed: 0, maya: false, time: 'day', zoom: 1 };

function setTime(time) {
  const hour = time === 'evening' ? 17.6 : time === 'night' ? 21 : time === 'morning' ? 7.5 : null;
  if (hour == null) {
    lights.hemi.color.set('#FFF7EA'); lights.hemi.groundColor.set('#CDBF9F'); lights.hemi.intensity = 1.45;
    lights.sun.color.set('#FFF0DA'); lights.sun.intensity = 1.9; lights.sun.position.set(-4, 10, 3);
    scene.background.set('#F2E6CC'); renderer.toneMappingExposure = 1;
    return;
  }
  const s = sampleDaytime(hour);
  lights.hemi.color.set(s.hemiSky); lights.hemi.groundColor.set(s.hemiGround); lights.hemi.intensity = s.hemi * 2.5;
  lights.sun.color.set(s.sun); lights.sun.intensity = s.sunIntensity;
  lights.sun.position.set(...s.sunDir).normalize().multiplyScalar(20);
  scene.background.set(s.skyHor); renderer.toneMappingExposure = s.exposure;
}

function placeCamera() {
  const v = cfg.view;
  const aspect = camera.aspect;
  if (v === 'game' || v === 'car') {
    // the story camera rig's on-foot (or car) follow view
    const F = v === 'game' ? { tilt: 30, width: 7, widthLandscape: 14, height: 0.9 } : { tilt: 52, width: 12, widthLandscape: 22, height: 0.6 };
    camera.fov = 45;
    camera.updateProjectionMatrix();
    const width = aspect < 1 ? F.width : F.widthLandscape;
    const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(45) / 2) * aspect);
    const d = width / 2 / Math.tan(hfov / 2) / (cfg.zoom || 1); // ?zoom=3: same angle, nearer
    const tilt = THREE.MathUtils.degToRad(F.tilt);
    camera.position.set(0, F.height + Math.sin(tilt) * d, Math.cos(tilt) * d);
    camera.lookAt(0, F.height, 0);
    return;
  }
  camera.fov = 30;
  camera.updateProjectionMatrix();
  const wide = cfg.maya ? 1.25 : 1;
  const d = (aspect < 1 ? 5.6 : 3.8) * wide;
  const tilt = THREE.MathUtils.degToRad(params.has('tilt') ? parseFloat(params.get('tilt')) : 10);
  camera.position.set(0, 0.7 + Math.sin(tilt) * d, Math.cos(tilt) * d);
  camera.lookAt(0, 0.62, 0);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  const v = renderer.getDrawingBufferSize(new THREE.Vector2());
  setOutlineResolution(v.x, v.y);
  placeCamera();
}
addEventListener('resize', resize);

const facing = () => (cfg.view === 'side' || cfg.view === 'game' || cfg.view === 'car' ? Math.PI / 2 : cfg.view === 'three' ? 0.6 : cfg.view === 'back' ? Math.PI : 0);

async function build() {
  hh?.dispose(); if (hh) scene.remove(hh.root);
  hh = createHeinHtet();
  window.hh = hh;
  scene.add(hh.root);
  hh.root.rotation.y = facing();
  hh.root.position.x = cfg.maya ? 0.42 : 0;
  if (cfg.maya) {
    if (!mayaMod) mayaMod = await import('../js/game/actors/maya.js');
    if (!maya) { maya = mayaMod.createMaya({ outfit: 'writer', blink: false, fidget: false, seed: 11 }); scene.add(maya.root); }
    maya.root.visible = true;
    maya.root.position.set(-0.42, 0, 0);
    maya.root.rotation.y = cfg.view === 'side' ? Math.PI / 2 : 0.25;
  } else if (maya) maya.root.visible = false;
}

let elapsed = 0, frozen = false, loopTimer = 0;
function startAnim() {
  const a = cfg.anim;
  hh.run(a === 'run' ? (cfg.speed || 4) : cfg.speed || 0);
  if (a && a !== 'run' && a !== 'idle') hh.play(a);
}
function step(dt) {
  hh.update(dt);
  maya?.root.visible && maya.update(dt, { speed: 0, t: 0 });
}

function measure() {
  // his own draw calls and triangles: render him alone once
  const vis = [ground.visible, maya?.root.visible];
  ground.visible = false; if (maya) maya.root.visible = false;
  renderer.render(scene, camera);
  const i = renderer.info.render;
  window.__hhStats = { calls: i.calls, triangles: i.triangles };
  ground.visible = vis[0]; if (maya) maya.root.visible = vis[1];
}

window.show = async (o = {}) => {
  Object.assign(cfg, { anim: null, t: null, view: 'front', speed: 0, maya: false, time: 'day', zoom: 1 }, o);
  window.__ready = false;
  await build();
  setTime(cfg.time);
  resize();
  elapsed = 0;
  startAnim();
  frozen = cfg.t != null;
  if (frozen) { const n = Math.round(cfg.t * 60); for (let k = 0; k < n; k++) step(1 / 60); elapsed = cfg.t; }
  const name = cfg.anim || 'idle';
  document.getElementById('label').innerHTML = `ကိုဟိန်းထက်<small>${name}${cfg.t != null ? ' @ ' + cfg.t.toFixed(2) + 's' : ''} · ${cfg.view}${cfg.time !== 'day' ? ' · ' + cfg.time : ''}</small>`;
  measure();
  renderer.render(scene, camera);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  window.__ready = true;
  return window.__hhStats;
};

const timer = new THREE.Timer();
timer.connect(document);
renderer.setAnimationLoop((ts) => {
  timer.update(ts);
  if (!hh) return;
  if (!frozen) {
    const dt = Math.min(timer.getDelta(), 0.1);
    elapsed += dt;
    step(dt);
    // replay one-shots in live mode
    if (cfg.anim && cfg.anim !== 'run' && cfg.anim !== 'idle' && !hh.anim) { loopTimer += dt; if (loopTimer > 0.7) { loopTimer = 0; hh.play(cfg.anim); } }
  }
  renderer.render(scene, camera);
  const i = renderer.info.render;
  const s = `calls ${i.calls} | tris ${i.triangles}` + (window.__hhStats ? ` | him ${window.__hhStats.calls}/${window.__hhStats.triangles}` : '');
  document.getElementById('stats').textContent = s;
});

if (params.get('ui') === '1') {
  const ui = document.getElementById('ui');
  ui.style.display = 'flex';
  for (const a of ['idle', 'run', ...HH_ANIMS]) {
    const b = document.createElement('button');
    b.textContent = a;
    b.onclick = () => window.show({ ...cfg, anim: a, t: null, speed: a === 'run' ? 4 : 0 });
    ui.appendChild(b);
  }
}
window.HH_ANIMS = HH_ANIMS; window.HH_ANIM_DUR = HH_ANIM_DUR;
await window.show({
  anim: params.get('anim'), t: params.has('t') ? parseFloat(params.get('t')) : null, view: params.get('view') || 'front',
  speed: params.has('speed') ? parseFloat(params.get('speed')) : 0, maya: params.get('maya') === '1', time: params.get('time') || 'day', zoom: parseFloat(params.get('zoom') || '1'),
});
document.title = 'calls ready';
void toon;
</script>
</body>
</html>
