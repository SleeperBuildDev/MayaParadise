<!doctype html>
<html lang="my" data-lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>chatter</title>
<link rel="stylesheet" href="dev.css">
<style>
  html, body { background: #EDE6D3; }
  #play { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #pill { position: fixed; left: 50%; top: 4px; transform: translateX(-50%); z-index: 10; font: 700 11px/1.4 system-ui, sans-serif; padding: 3px 10px;
    border-radius: 999px; border: 1px solid #A47A2C; background: rgba(255,253,248,.85); color: #6E1F2A; }
  #panel { position: fixed; left: 8px; right: 8px; top: 30px; z-index: 10; max-height: 62vh; overflow: auto; background: rgba(255,253,248,.95); border: 2px solid #C9A24A;
    border-radius: 12px; padding: 8px 10px; font: 12px/1.45 system-ui, sans-serif; color: #2A2118; box-shadow: 0 6px 18px rgba(59,42,26,.2); }
  #panel[hidden] { display: none; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 4px 0; }
  #panel button, #panel select { font: 600 12px/1.3 system-ui, sans-serif; padding: 4px 8px; border-radius: 8px; border: 1px solid #A47A2C; background: #FFFDF8; color: #2A2118; }
  #panel pre { margin: 4px 0 0; white-space: pre-wrap; font: 11px/1.35 ui-monospace, monospace; max-height: 30vh; overflow: auto; background: #F6F0E2; padding: 5px; border-radius: 6px; }
  #panel b { color: #6E1F2A; }
</style>
</head>
<body>
<iframe id="play" title="game"></iframe>
<button id="pill" type="button">chatter</button>
<div id="panel" hidden>
  <div class="row"><b>District</b>
    <select id="dist"><option value="">(where Maya is)</option></select>
    <button data-go>go there</button>
    <button data-go-pair>go to a pair</button>
  </div>
  <div class="row"><b>Say</b>
    <button data-say>town line</button>
    <select id="area"><option value="">(area)</option></select><button data-area>area line</button>
    <button data-pair>pair</button>
    <button data-pair-any>pair (anyone)</button>
  </div>
  <div class="row"><b>Room</b>
    <select id="room"><option value="">(room)</option></select><button data-room>enter</button><button data-room-say>room line</button>
  </div>
  <div class="row"><b>Arrive</b><button data-arrive="1">first</button><button data-arrive="0">again</button>
    <label><input type="checkbox" id="auto"> auto-detect</label>
    <label><input type="checkbox" id="fast"> fast</label>
    <button data-lang>EN/MY</button><button data-reset>forget used</button>
  </div>
  <pre id="out">loading the game...</pre>
</div>
<script type="module">
// Dev page for js/story/chatter/index.js: the real game (index.html?story&chatter=1) in a frame, with the chatter
// module started inside it and a debug panel to force a district / area / pair / room line.
//   ?day=N (passed through to the game)  ?panel=1 (panel open)  ?panel=0 (no pill either: clean screenshots)
//   ?folk=0 (do not stand the not-yet-in-cast.js townsfolk at their spots; __dev.go / goPair do it otherwise)
//   ?lang=en   ?time=11 (the hour)   any other game params pass through (foot=1, reset, tier=low ...)
// In the console / steps: __fw = the game's window; __chatter = the module; __dev.go('market'), __dev.goPair('market'),
//   __dev.room('teashop'), __chatter.debug.say(), __chatter.debug.pair({ anyone: true }), __chatter.debug.state()
// When a writer's lines-X.js is not there yet, a few SAMPLE lines (below, dev only) stand in for that district.
window.addEventListener('error', (e) => { document.title = `ERR ${e.message} @${e.lineno}`; });
const params = new URLSearchParams(location.search);
const pass = new URLSearchParams();
for (const [k, val] of params) if (!['panel', 'folk'].includes(k)) pass.set(k, val);
for (const [k, val] of Object.entries({ play: '1', story: '', music: '0', barks: '0', chatter: '1' })) if (!pass.has(k)) pass.set(k, val);
const frame = document.getElementById('play');
frame.src = '../index.html?' + pass.toString().replace(/story=(&|$)/, 'story$1');
const panel = document.getElementById('panel'), pill = document.getElementById('pill'), out = document.getElementById('out');
if (params.get('panel') === '1') panel.hidden = false;
if (params.get('panel') === '0') pill.hidden = true;
pill.addEventListener('click', () => { panel.hidden = !panel.hidden; });

// ---- sample lines (dev only; the writers' files replace them district by district)
const SAMPLE = {
  exercise: {
    town: [
      { my: 'အလွတ်ကျက်တာထက် နားလည်တာက ကြာကြာခံတယ်။', en: 'Understanding lasts longer than learning by heart.' },
      { my: '"မရဘူး" မဟုတ်ဘူးနော်၊ "မရသေးဘူး"။', en: 'Not "can\'t". "Not yet."' },
      { my: 'ကလေးတွေ ရေးတာ နှေးပေမဲ့ သေသေချာချာပဲ။', en: 'The kids write slowly, but carefully.', age: ['adult', 'elder'] },
    ],
    pairs: [{ id: 'sample-ex', who: ['*', '*'], lines: [
      { my: 'မင်းသမီး စာတွေ တော်လာပြီလား။', en: "Is your girl doing better at school?" },
      { my: 'အမှတ်တော့ မသိဘူး၊ မေးခွန်းတွေ များလာတယ်။', en: "Don't know about marks. She asks more questions." },
      { my: 'အဲဒါ ပိုကောင်းတာပေါ့။', en: "That's the better sign." },
    ] }],
    arrive: { first: { my: 'မျဉ်းကြောင်းစာရွက်တွေနဲ့ ရပ်ကွက်လေး။ ကျောင်းနံ့ ရတယ်။', en: 'A quarter of ruled paper. It smells like school.' } },
  },
  market: {
    town: [
      { my: 'ကိုယ့်အိုး အရင်ဖြည့်မှ သူများကို ငှဲ့ပေးနိုင်မှာ။', en: 'Fill your own pot first, then pour for others.' },
      { my: 'ဘေးဆိုင် ရောင်းကောင်းတော့ ဝမ်းသာပါတယ်။', en: "Next door's selling well. Good for them." },
      { my: 'ပေးချင်လို့ ပေးတာ၊ ပြန်မမျှော်ဘူး။', en: 'I give because I want to. I expect nothing back.' },
    ],
    rooms: { teashop: [
      { my: 'လက်ဖက်ရည် တစ်ခွက်လောက် ထပ်ပေးပါဦး။', en: 'One more tea, please.' },
      { my: 'ဒီဆိုင်က ချိုတာ အနေတော်ပဲ။', en: 'They get the sweetness just right here.' },
    ] },
    pairs: [{ id: 'sample-mk', who: ['*', '*'], lines: [
      { my: 'ဒီနေ့ ရောင်းကောင်းလား။', en: 'Good day for sales?' },
      { my: 'မဆိုးဘူး။ ဘေးဆိုင်ကတော့ ကုန်သွားပြီ။', en: 'Not bad. Next door sold out already.' },
      { my: 'ဟုတ်လား၊ ဝမ်းသာစရာပဲ။', en: 'Really? Good for them.' },
    ] }],
    arrive: { first: { my: 'ဖွင့်ထားတဲ့ စာတစ်စောင်လို ဈေးကြီး။', en: 'A market laid out like an open letter.' } },
  },
  wharf: {
    town: [
      { my: 'ရေစီးကို ရွေးလို့မရဘူး၊ တက်ခတ်ပုံပဲ ရွေးရတာ။', en: "You can't pick the current, only how you row." },
      { my: 'အငြိုးထားရင် ကိုယ့်ရင်ပဲ ပူတာ။', en: 'Hold a grudge and only your own chest burns.' },
    ],
    arrive: { first: { my: 'စာရင်းစာအုပ်လို ဆိပ်ကမ်း။ ရေနံ့ ရတယ်။', en: 'A wharf like a ledger. I can smell the water.' } },
  },
  junction: {
    town: [
      { my: 'စာထဲမှာ ပါတိုင်း မှန်တာ မဟုတ်ဘူးလေ။', en: "Not everything in print is true." },
      { my: 'ကိုယ်တိုင် သွားကြည့်ပြီးမှ ယုံတယ်။', en: 'I believe it once I have seen it myself.' },
      { my: 'တံတားကြီး ဖွင့်ပြီးကတည်းက လမ်းဆုံ စည်လာတယ်။', en: 'The crossing has been busy since the bridge opened.', from: 8 },
    ],
  },
  hearth: {
    town: [
      { my: 'စကားကြမ်းပေမဲ့ စိတ်ကောင်းတယ်ဆိုတာ ဆင်ခြေပဲ။', en: '"Rough mouth, good heart" is just an excuse.' },
      { my: 'မုန့်ဖုတ်နံ့က လမ်းတစ်လမ်းလုံး မွှေးတယ်။', en: 'The baking smell fills the whole row.' },
    ],
    rooms: {
      bakery: [{ my: 'ဒီနေ့ ပေါင်မုန့် ကောင်းကောင်း ဖောင်းတယ်။', en: 'The bread rose nicely today.' }],
      hearthtea: [
        { my: 'စိတ်ပူနေရင် လက်ဖက်ရည်လည်း ခါးတယ်။', en: 'When you are angry, even the tea tastes bitter.' },
        { my: 'အေးအေးဆေးဆေး သောက်ပါ၊ မီးမလောင်ပါဘူး။', en: 'Drink slowly. Nothing is on fire.' },
      ],
      noodlehouse: [{ my: 'ခေါက်ဆွဲ ပူပူလေး၊ ဘာမှ မပူနဲ့။', en: 'Hot noodles. No need to be hot-headed.' }],
    },
  },
};

// ---- start the chatter inside the game's window once the story is up
const modUrl = new URL('../js/story/chatter/index.js', location.href).href;
const regUrl = new URL('../js/story/world/region.js', location.href).href;
const castUrl = new URL('../js/story/cast.js', location.href).href;
let fw = null, chatter = null, dev = null;
async function boot() {
  for (;;) {
    fw = frame.contentWindow;
    // (__mwGame is set only once the day's create() resolves; a day that opens on a scene waits for a tap, so use story.game)
    if (fw?.__story && (fw.__mwGame || fw.__story.game) && fw.document.body.classList.contains('playing')) break;
    await new Promise((r) => setTimeout(r, 300));
  }
  if (params.get('lang') === 'en') fw.document.documentElement.setAttribute('data-lang', 'en');
  const [{ createChatter }, region, cast] = await Promise.all([modUrl, regUrl, castUrl].map((u) => fw.eval(`import(${JSON.stringify(u)})`)));
  const story = fw.__story, game = fw.__mwGame || fw.__story.game;
  // The game wires its own chatter in now (story.js -> extras-chatter.js -> story.chatter). Use that one: a second
  // instance would talk over it (two sets of bubbles on the same heads). Only an older build without it gets ours.
  for (let i = 0; i < 40 && !story.chatter; i++) await wait(250);
  const own = !story.chatter;
  chatter = story.chatter || createChatter(game, story);
  await chatter.ready;
  // samples only for districts no writer has filled yet
  const missing = {};
  for (const [d, t] of Object.entries(SAMPLE)) if (!chatter.lines[d]) missing[d] = t;
  chatter.addLines(missing);
  // run it every frame after the story (only when we made it: the game's own is already in story.update)
  if (own) {
    const upd = story.update;
    story.update = function (dt, t) { upd.call(this, dt, t); chatter.update(dt); };
  }
  if (!own && params.get('chatter') !== '0') chatter.autoArrive = true;
  fw.__chatter = window.__chatter = chatter;
  window.__fw = fw;
  dev = window.__dev = makeDev(story, game, region, cast);
  fill();
  setInterval(showState, 700);
  document.title = 'chatter ready';
}

function makeDev(story, game, region, cast) {
  // (only people cast.js lists ever appear: story.spawn needs a cast entry)
  // The district townsfolk (world/regions/*-folk.js) are not in cast.js yet, so the game spawns none of them and the
  // street lines meant for them stay silent. DEV ONLY: stand them at their region spots (still, no jobs) so the lines
  // can be heard and checked. ?folk=0 shows only who the game itself spawns today.
  const FOLK_FILES = ['hearth-folk.js', 'garden-folk.js', 'garden-town-folk.js', 'market-townfolk.js', 'wharf-folk.js', 'junction-people.js', 'blank-folk.js'];
  let folkMap = null;
  async function spawnFolk(d) {
    if (params.get('folk') === '0') return 0;
    if (!folkMap) {
      folkMap = new Map();
      const imp = (u) => fw.eval(`import(${JSON.stringify(new URL(u, location.href).href)})`).catch(() => null);
      const mods = await Promise.all(FOLK_FILES.map((f) => imp('../js/story/world/regions/' + f)));
      for (const m of mods) for (const v of Object.values(m || {})) if (Array.isArray(v)) for (const c of v) if (c?.id && c.look && c.role) folkMap.set(c.id, c);
      folkMap.people = await imp('../js/story/people.js');
    }
    let n = 0;
    for (const pp of region.PEOPLE) {
      const c = folkMap.get(pp.id);
      if (!c || cast.castById(pp.id) || story.people.has(pp.id) || chatter.districtAt(pp.x, pp.z) !== d) continue;
      const p = folkMap.people.createPerson(c.look);
      p.root.position.set(pp.x, 0, pp.z); p.root.rotation.y = pp.heading || 0; p.root.userData.isPerson = true;
      game.world.scene.add(p.root);
      story.people.set(pp.id, { id: pp.id, cast: c, p, home: { x: pp.x, z: pp.z, h: pp.heading || 0 }, ob: { type: 'circle', x: pp.x, z: pp.z, r: p.radius || 0.3, person: pp.id }, onTalk: null, walking: null, devFolk: true });
      n++;
    }
    return n;
  }
  const folkIn = (d) => region.PEOPLE.filter((p) => (cast.castById(p.id) || story.people.get(p.id)?.devFolk) && chatter.districtAt(p.x, p.z) === d);
  async function onFoot() { if (!story.foot.active) await story.foot.toFoot(); story.refreshHud?.(); }
  async function out() { if (story.inRoom) { await game.exitRoom?.(); await wait(1500); } }
  return {
    folkIn,
    spawnFolk,
    cast: cast.CAST,
    /** stand Maya beside a townsperson of the district (i: which one) */
    async go(d, i = 0) {
      await out(); await onFoot(); await spawnFolk(d);
      const f = folkIn(d);
      const p = f[i % Math.max(1, f.length)];
      if (!p) return false;
      story.openWorld.jump(p.x + 1.4, p.z + 1.6, 0);
      return p.id;
    },
    /** stand Maya near two townsfolk who work close together */
    async goPair(d, skip = 0) {
      await out(); await onFoot(); await spawnFolk(d);
      const f = folkIn(d);
      const pairs = [];
      for (let a = 0; a < f.length; a++) for (let b = a + 1; b < f.length; b++) { const dd = Math.hypot(f[a].x - f[b].x, f[a].z - f[b].z); if (dd < 4.2 && dd > 1.2) pairs.push([f[a], f[b], dd]); }
      pairs.sort((x, y) => x[2] - y[2]);
      const pr = pairs[skip % Math.max(1, pairs.length)];
      if (!pr) return false;
      story.openWorld.jump((pr[0].x + pr[1].x) / 2, Math.max(pr[0].z, pr[1].z) + 2.2, 0);
      return [pr[0].id, pr[1].id];
    },
    async room(id) { await out(); await onFoot(); return story.enterOnFoot(id); },
  };
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// ---- the panel
const $ = (s) => document.querySelector(s);
function fill() {
  const ds = ['home', 'exercise', 'envelope', 'market', 'wharf', 'junction', 'hearth', 'garden', 'blank', 'backcover'];
  for (const d of new Set([...ds, ...Object.keys(chatter.lines)])) $('#dist').add(new Option(d + (chatter.lines[d] ? '' : ' (no lines)'), d));
  const areas = $('#area'), rooms = $('#room');
  for (const [d, t] of Object.entries(chatter.lines)) {
    for (const a of Object.keys(t.areas)) areas.add(new Option(d + ':' + a, d + ':' + a));
    for (const r of Object.keys(t.rooms)) rooms.add(new Option(d + ':' + r, r));
  }
  $('#auto').checked = chatter.autoArrive;
}
const dist = () => $('#dist').value || null;
panel.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button');
  if (!b || !chatter) return;
  if (b.hasAttribute('data-go')) await dev.go(dist() || 'market');
  else if (b.hasAttribute('data-go-pair')) await dev.goPair(dist() || 'market');
  else if (b.hasAttribute('data-say')) { chatter.debug.force({ district: dist() }); log(chatter.debug.say({ district: dist() || undefined })); }
  else if (b.hasAttribute('data-area')) { const [d, a] = $('#area').value.split(':'); if (a) { const at = chatter.lines[d].areas[a].at; await dev.go(d); fw.__story.openWorld.jump(at.x, at.z, 0); await wait(1200); log(chatter.debug.say({ district: d, area: a })); } }
  else if (b.hasAttribute('data-pair')) log(chatter.debug.pair({ district: dist() || undefined }));
  else if (b.hasAttribute('data-pair-any')) log(chatter.debug.pair({ district: dist() || undefined, anyone: true }));
  else if (b.hasAttribute('data-room')) { const r = $('#room').value; if (r) await dev.room(r); }
  else if (b.hasAttribute('data-room-say')) log(chatter.debug.say());
  else if (b.hasAttribute('data-arrive')) log(chatter.onArrive(dist() || chatter.district, b.dataset.arrive === '1'));
  else if (b.hasAttribute('data-lang')) { const h = fw.document.documentElement; h.setAttribute('data-lang', h.getAttribute('data-lang') === 'en' ? 'my' : 'en'); fw.document.dispatchEvent(new Event('mw:lang')); }
  else if (b.hasAttribute('data-reset')) chatter.debug.reset();
});
$('#auto').addEventListener('change', (e) => { chatter.autoArrive = e.target.checked; });
$('#fast').addEventListener('change', (e) => chatter.debug.fast(e.target.checked));
let lastLog = '';
function log(r) { lastLog = 'result: ' + JSON.stringify(r); showState(); }
function showState() {
  if (!chatter || panel.hidden) return;
  const s = chatter.debug.state();
  const said = chatter.log.slice(-4).map((x) => `${x.t}s ${x.kind} ${x.who}: ${x.en}`).join('\n');
  out.textContent = `${lastLog}\n${JSON.stringify(s, null, 1)}\n--- said ---\n${said}`;
}
boot();
</script>
</body>
</html>
