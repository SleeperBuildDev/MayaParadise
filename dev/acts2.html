window.addEventListener('error', (e) => { document.title = `ERR ${e.message} @${e.lineno}`; });

const out = document.getElementById('out');
let running = false;
async function run(id, care = null) {
  if (running) return;
  running = true;
  out.textContent = `${id}…`;
  try {
    const p = SAMPLES[id].run();
    if (care != null) {
      const go = () => { const a = window.__act; if (a && a[SAMPLES[id].hook]) a[SAMPLES[id].hook](care); else setTimeout(go, 100); };
      setTimeout(go, 500);
    }
    const r = await p;
    window.__last = r;
    out.textContent = `${id} → ${JSON.stringify(r)}`;
  } catch (e) { out.textContent = `${id} ✕ ${e.message}`; console.error(e); }
  running = false;
}
const actsRow = document.getElementById('acts');
const autosRow = document.getElementById('autos');
for (const [id, s] of Object.entries(SAMPLES)) {
  const b = document.createElement('button');
  b.innerHTML = `${s.label[0]}<small>${s.label[1]}</small>`;
  b.addEventListener('click', () => run(id));
  actsRow.append(b);
  // pin's hook takes seconds to hold, the others take care (1 well, .3 rushed)
  for (const [arg, name] of s.autos || [[1, `${id} well`], [0.3, `${id} rushed`]]) {
    const a = document.createElement('button');
    a.className = 'alt';
    a.textContent = name;
    a.addEventListener('click', () => run(id, arg));
    autosRow.append(a);
  }
}
document.getElementById('lang').addEventListener('click', () => {
  const h = document.documentElement;
  h.setAttribute('data-lang', h.getAttribute('data-lang') === 'en' ? 'my' : 'en');
});
window.__acts = { run, SAMPLES };
await fontsReady();
document.title = 'acts2 ready';
const id = params.get('act');
if (id && SAMPLES[id]) run(id, params.has('auto') ? Number(params.get('auto')) || 1 : null);
</script>
