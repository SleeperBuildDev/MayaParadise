<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ground preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6F1E4; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #tag { position: fixed; left: 8px; top: 8px; z-index: 5; font: 700 12px/1.35 Georgia, serif; color: #2A2118; background: rgba(246,241,228,.88);
    border: 1px solid #A47A2C; border-radius: 8px; padding: 4px 8px; pointer-events: none; }
  #tag small { display: block; font: 11px/1.3 monospace; color: #6B5A44; }
</style>
</head>
<body>
<iframe id="game" title="game" allow="autoplay"></iframe>
<div id="tag"></div>
<script type="module">
// Ground preview (dev only). Boots the real story game in a same-origin iframe with the painted ground the game
// itself uses (js/story/world/ground.js, wired in by stream.js; style C), puts Maya on foot at a named spot with
// the game's own walking camera. No game file is changed; nothing is saved: the visitor's story save is put back
// when this page closes.
//
//   dev/ground.html?ground=C|A|B|simple|full|off   off = the plain paper (before); simple = the cheap shader
//                  &spot=quarter|street|market|wharf|garden|hearth|junction|blank   or &at=x,z,heading
//                  &day=N (story day for the test save, default 3)  &time=11 (hour)  &tier=low|mid|high
//                  &tag=0 hides the label;  &swatch=1 the painted layers side by side (and their AVG table)
// Window hooks (for tools/phone.mjs): __mwGame, __story, __openWorld, __ground (the iframe's), __groundReady,
// __groundStats() -> renderer numbers, await __setGround('A'|'B'|'C'|'simple'|'off') reloads the game with it.
const params = new URLSearchParams(location.search);
if (params.get('swatch') === '1') {
  const { groundCanvas, layerAverage, LAYERS } = await import('../js/story/world/ground.js');
  document.getElementById('game').remove();
  document.body.style.cssText = 'overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;height:auto';
  const avg = {};
  for (const k of LAYERS) {
    const c = document.createElement('canvas'); c.width = c.height = 512; c.style.cssText = 'width:100%;aspect-ratio:1';
    const g = c.getContext('2d'); g.drawImage(groundCanvas(k), 0, 0, 256, 256); g.drawImage(groundCanvas(k), 256, 0, 256, 256); g.drawImage(groundCanvas(k), 0, 256, 256, 256); g.drawImage(groundCanvas(k), 256, 256, 256, 256);
    g.fillStyle = '#fff'; g.font = 'bold 26px Georgia'; g.fillText(k, 10, 32);
    document.body.appendChild(c);
    avg[k] = layerAverage(k);
  }
  // the table ground.js keeps as AVG (the flat fill, and the simple shader's colours)
  window.__avg = avg;
  document.getElementById('tag').innerHTML = `AVG<small>${Object.entries(avg).map(([k, v]) => `${k}: [${v.join(', ')}]`).join('<br>')}</small>`;
  window.__groundReady = true;
  throw new Error('swatch only');
}
const SPOTS = {
  quarter: [-2.5, 71.0, 0], // a Quarter house: its back plots and fence, the street beyond
  street: [-12.0, 96.0, 0],
  market: [31.0, 302.0, 0], //  the market's lanes, stalls and the letter counter
  wharf: [52.0, 420.0, 0],
  garden: [166.0, 70.0, 0], // the Diary Garden by the big kiln
  hearth: [140.0, 200.0, 0],
  junction: [150.0, 300.0, 0],
  blank: [133.0, 8.0, 0],
};
const spotName = params.get('spot') || 'quarter';
const at = params.has('at') ? params.get('at').split(',').map(Number) : SPOTS[spotName] || SPOTS.quarter;
let cur = (params.get('ground') || 'C').toLowerCase();
const tag = document.getElementById('tag');
if (params.get('tag') === '0') tag.hidden = true;
const setTag = (extra = '') => { tag.innerHTML = `ground ${cur === 'off' ? 'before' : cur} · ${window.__spot || (params.has('at') ? at.join(',') : spotName)}<small>${extra}</small>`; };
setTag('booting…');

// ---- a throw-away save (the story starts out on the land, on foot); the real one comes back on close
const KEY = 'rc-story-v1', BACKUP = 'rc-story-v1.ground-backup';
function testSave(p) {
  try {
    if (sessionStorage.getItem(BACKUP) === null) sessionStorage.setItem(BACKUP, localStorage.getItem(KEY) ?? '\u0000');
    const day = +(params.get('day') || 3), F = {}; for (const k of ['done', 'morning']) F[`d${day}.${k}`] = true;
    localStorage.setItem(KEY, JSON.stringify({ v: 1, created: 'ground-dev', day, dayDone: true, flags: F, bag: { letter: 1, notebook: 1, quill: 1 }, trunk: {},
      companions: [], pencil: {}, stamps: [], notebook: { sleptAt: [] }, place: { mode: 'foot', x: p[0], z: p[1], heading: p[2] || 0 } }));
  } catch { /* private mode */ }
}
function restoreSave() {
  try {
    const b = sessionStorage.getItem(BACKUP);
    if (b === null) return;
    if (b === '\u0000') localStorage.removeItem(KEY); else localStorage.setItem(KEY, b);
    sessionStorage.removeItem(BACKUP);
  } catch { /* ignore */ }
}
addEventListener('pagehide', restoreSave);

const frame = document.getElementById('game');
const W = () => frame.contentWindow;
for (const k of ['__mwGame', '__story', '__openWorld', '__ground']) Object.defineProperty(window, k, { get: () => W()?.[k], configurable: true });
window.__groundReady = false;
const until = async (fn, ms = 400000) => { const end = performance.now() + ms; while (performance.now() < end) { try { if (fn()) return true; } catch { /* loading */ } await new Promise((r) => setTimeout(r, 200)); } return false; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function boot(p) {
  window.__groundReady = false;
  testSave(p);
  const q = new URLSearchParams({ play: '1', music: '0', barks: '0', time: params.get('time') || '11', foot: '1', ground: cur });
  if (params.has('tier')) q.set('tier', params.get('tier'));
  frame.src = `../index.html?story&${q}`;
  await sleep(500);
  await until(() => W().__mwGame && W().__openWorld && W().__story && W().document.body.classList.contains('playing'));
  await sleep(2500); // the day's own opening settles first
  const win = W(), game = win.__mwGame, ow = win.__openWorld;
  if (game.mode !== 'world') await game.exitRoom?.().catch?.(() => {});
  if (!win.__story.foot?.active) await win.__story.foot?.toFoot?.();
  ow.jump(p[0], p[1], p[2] || 0);
  await sleep(1200);
  ow.jump(p[0], p[1], p[2] || 0);
  await sleep(1500);
  window.__groundReady = true;
}
let here = at;
// __goSpot('market') (or [x, z, heading]): move Maya there, chunks built, camera snapped
window.__goSpot = async (name) => {
  const p = Array.isArray(name) ? name : SPOTS[name];
  here = p;
  W().__openWorld.jump(p[0], p[1], p[2] || 0);
  await sleep(1500);
  W().__openWorld.jump(p[0], p[1], p[2] || 0);
  window.__spot = name;
  return true;
};
// __setGround('A'): the same spot with another ground (the game reloads: the ground is built in, not patched on)
window.__setGround = async (m) => { cur = String(m || 'off').toLowerCase(); await boot(here); return cur; };
window.__groundStats = () => { const g = W().__mwGame, i = g.renderer.info; return { calls: i.render.calls, triangles: i.render.triangles, textures: i.memory.textures, geometries: i.memory.geometries, ...(W().__openWorld.stats?.() || {}), ground: W().__ground?.info?.() || { mode: 'off' } }; };
setInterval(() => { try { const s = window.__groundStats(); setTag(`calls ${s.calls} · tris ${s.triangles} · tex ${s.textures} · ${s.ground.option || ''} ${s.ground.mode}`); } catch { /* reloading */ } }, 1000);
await boot(at);
</script>
</body>
</html>
