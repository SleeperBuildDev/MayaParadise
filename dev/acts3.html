const out = document.getElementById('out');

async function run(name, auto) {
  if (running) return;
  running = true;
  out.textContent = `${name}…`;
  try {
    const p = SAMPLES[name]();
    if (auto) setTimeout(() => window.__act && auto(window.__act), 900);
    const r = await p;
    window.__last = r;
    out.textContent = `${name} → ${JSON.stringify(r, null, 1)}`;
  } catch (e) { out.textContent = `${name} ✗ ${e.stack || e}`; }
  running = false;
}

}
