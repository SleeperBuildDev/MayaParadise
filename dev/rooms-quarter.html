<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quarter rooms</title>
<link rel="stylesheet" href="dev.css">
<style>
  #name { position: fixed; left: 0; right: 0; top: 10px; text-align: center; font: 700 15px/1.7 "Noto Sans Myanmar", sans-serif; color: #2A2118; }
  #name small { display: block; font: 600 12px/1.3 Georgia, serif; color: #A47A2C; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="name"></div>
<div id="stats"></div>
<script type="module">
// Dev page for js/story/rooms/quarter.js
// ?room=classroom|snackshop|pottershed|quartertea|bordertea  &day=2  &evening=0..1  &rain=0..1
// &people=0 (empty room)  &extras=0 (drop walk-ons marked 'extra')  &maya=0 (no Maya)  &mayaSpot=<spot>
// &mayaH=<heading> (default: turned toward the camera so her face and outfit read)  &outfit=writer|author
// &cam=phone (6 m wide, like the game)  &cam=wide (whole room, the old framing)  &cx=<x>  &t=2 (frozen time)
// Default framing fits the room's width at a 54 degree tilt (steeper hides faces under the big chibi
// hair; flatter hides the back wall). A whole 7-8 m room only fills ~45% of a 412 x 915 phone at this
// aspect: the game camera follows the player at ~6 m wide (cam=phone), so the hook should not fit the
// whole room either. window.__check() lists stations / spots inside obstacle footprints and stations the door
// cannot reach (grid flood-fill at 0.1 m with a 0.25 m body radius).
window.addEventListener('error', (e) => { document.title = `ERR ${e.message} @${e.lineno}`; });
window.addEventListener('unhandledrejection', (e) => { document.title = `ERR ${e.reason?.message || e.reason}`; });
import * as THREE from '../js/game/three.js';
import { fontsReady } from '../js/game/toon.js';
import { ROOMS, WALKONS } from '../js/story/rooms/quarter.js';
import { createPerson } from '../js/story/people.js';
import { CAST } from '../js/story/cast.js';
import { startDevView } from './devview.js';

await fontsReady();
const params = new URLSearchParams(location.search);
const id = params.get('room') || 'classroom';
const def = ROOMS[id];
const day = params.has('day') ? +params.get('day') : def.days[0];
const room = def.build({ day });
if (params.has('evening')) room.setEvening(+params.get('evening'));
if (params.has('rain')) room.setRain(+params.get('rain'));
document.getElementById('name').innerHTML = `${def.name.my}<small>${def.name.en} · day ${day}</small>`;

const people = [];
if (params.get('people') !== '0') {
  for (const [spot, who, tag] of def.people(day)) {
    if (tag === 'extra' && params.get('extras') === '0') continue;
    const s = room.spots[spot];
    if (!s) { console.warn('no spot', spot); continue; }
    const cast = CAST.find((c) => c.id === who);
    const look = cast ? cast.look : WALKONS[who];
    if (!look) { console.warn('no look', who); continue; }
    const p = createPerson({ ...look, name: who });
    p.root.position.set(s.x, s.y || 0, s.z);
    p.root.rotation.y = s.h;
    room.scene.add(p.root);
    people.push(p);
  }
}
if (params.get('maya') !== '0' && room.spots.maya) {
  const { createMaya } = await import('../js/game/actors/maya.js');
  // the 'author' look (white blouse, orange scarf) reads apart from the pupils' white-and-green and the
  // drinkers' dark shirts; from behind, the 'writer' look is only her black hair and blouse
  const m = createMaya({ outfit: params.get('outfit') || 'author' });
  const s = room.spots[params.get('mayaSpot') || `mayaD${day}`] || room.spots.maya; // the day's own stop when the room has one
  m.root.position.set(s.x, s.y || 0, s.z);
  m.root.rotation.y = params.has('mayaH') ? +params.get('mayaH') : -0.35;
  room.scene.add(m.root);
  people.push({ update: (dt, t) => m.update(dt, { speed: 0, t }) });
}

const cam = params.get('cam') || 'fit';
const aspect = innerWidth / innerHeight;
const vfov = 45, tilt = parseFloat(params.get('tilt') || (cam === 'wide' ? 52 : cam === 'phone' ? 50 : 54));
const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(vfov / 2)) * aspect);
const widthToShow = cam === 'phone' ? 6 : cam === 'wide' ? room.width + 0.6 : room.width + 0.15;
const dist = widthToShow / 2 / Math.tan(hfov / 2);
const cx = parseFloat(params.get('cx') || 0);
startDevView({
  scene: room.scene, target: new THREE.Vector3(cx, 0.5, cam === 'wide' ? 0.3 : 0.25), distance: params.has('dist') ? undefined : (cam === 'wide' ? Math.max(10, dist) : dist), tilt, fov: vfov,
  update(dt, t) { room.update(dt, t); for (const p of people) p.update(dt, { speed: 0, t }); },
});
window.__room = room;

// --- collision / reachability check
function blocked(x, z, r = 0) {
  const b = room.bounds;
  if (x < b.minX || x > b.maxX || z < b.minZ || z > b.maxZ) return true;
  for (const o of room.obstacles) {
    if (o.type === 'box') { if (x > o.minX - r && x < o.maxX + r && z > o.minZ - r && z < o.maxZ + r) return true; }
    else if (Math.hypot(x - o.x, z - o.z) < o.r + r) return true;
  }
  return false;
}
window.__check = () => {
  const out = { inside: [], spotsInside: [], unreachable: [], doorBlocked: false };
  for (const s of room.stations) if (blocked(s.x, s.z)) out.inside.push(s.id);
  for (const [k, s] of Object.entries(room.spots)) if (!s.y && blocked(s.x, s.z)) out.spotsInside.push(k);
  const step = 0.1, R = 0.25, hw = room.width / 2, hd = room.depth / 2;
  const nx = Math.round(room.width / step), nz = Math.round(room.depth / step);
  const seen = new Uint8Array(nx * nz);
  const cell = (x, z) => [Math.round((x + hw) / step), Math.round((z + hd) / step)];
  const [sx, sz] = cell(room.door.x, room.door.z);
  out.doorBlocked = blocked(room.door.x, room.door.z, R);
  const q = [[sx, sz]];
  seen[sz * nx + sx] = 1;
  while (q.length) {
    const [i, j] = q.pop();
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const a = i + di, b = j + dj;
      if (a < 0 || b < 0 || a >= nx || b >= nz || seen[b * nx + a]) continue;
      if (blocked(a * step - hw, b * step - hd, R)) continue;
      seen[b * nx + a] = 1;
      q.push([a, b]);
    }
  }
  for (const s of room.stations) {
    const [i, j] = cell(s.x, s.z);
    let ok = false;
    for (let a = -3; a <= 3 && !ok; a++) for (let b = -3; b <= 3 && !ok; b++) if (seen[(j + b) * nx + (i + a)]) ok = true;
    if (!ok) out.unreachable.push(s.id);
  }
  return out;
};
</script>
</body>
</html>
